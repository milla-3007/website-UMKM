<!doctype html>
<html lang="id">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Galeri Cafe Light Rose</title>
        <link rel="stylesheet" href="CSS/style.css" />
    </head> 
    <body>
       <a class="skip-link" href="#konten">Lewati ke konten utama</a>
        <header class="site-header">
          <nav class="nav" aria-label="Navigasi utama">
            <div class="brand">Cafe Light Rose</div>
            <ul>
              <li><a href="index.html">Beranda</a></li>
              <li><a href="galeri.html" aria-current="page">Galeri</a></li>
            </ul>
         </nav>
        </header>
    
        <main class="page" id="konten">
          <h1>Galeri Cafe Light Rose</h1>

        <section aria-labelledby="menu-title">
          <h2 id="menu-title">Suasana & Menu</h2>
          <div class="gallery-list">
            <figure class="media-card">
              <img src="assets/images/interiorCafe.png" alt="Interior hangat Cafe Light Rose" />
              <figcaption>Suasana nyaman untuk menikmati kopi.</figcaption>
            </figure>
            <figure class="media-card">
              <img src="assets/images/coffeRose.jpg" alt="Signature Rose Latte" />
              <figcaption>Rose Latte - menu andalan kafe.</figcaption>
            </figure>
            <figure class="media-card">
              <img src="assets/images/sotoTauto.png" alt=" Soto Tauto Pekalongan" />
              <figcaption>Soto Tauto - menu lokal khas Pekalongan.</figcaption>
            </figure>
        </div>
    </section>

    <section aria-labelledby="produk-title">
        <h2 id="produk-title">Produk Kemasan Khas</h2>
        <div class="gallery-list">
            <figure class="media-card">
              <img src="assets/images/etalaseProdukKhasLS.png" alt="etalase produk Kemasan Khas Light Rose" />
              <figcaption>Rose Latte RTD -  signature Light Rose dalam kemasan botol.</figcaption>
              <figcaption>Light Rose Blend - kopi bubuk racikan khas kafe.</figcaption>
              <figcaption> cheesecake Rose - lembut,creamy dengan rasa khas mawar </figcaption>
            </figure>
        </div>
    </section>

    <section aria-labelledby="proses-title">
       <h2 id="proses-title">Cerita Proses Seduh</h2>
       <div class="gallery-list">
          <figure class="media-card">
            <img src="assets/images/SeduhcoffeRose.png" alt="Barista menuang air panas ke dripper kopi" />
            <figcaption>Proses seduh manual, bagian dari cerita kualitas coffe Rose Latte.</figcaption> 
          </figure>
       </div>
    </section>

    <section aria-labelledby="audio-title">
       <h2 id="audio-title">Nada Khas Light Rose</h2>
       <p id="audio-note">Nada singkat menjadi identitas dan atmosfer khas Cafe Light Rose</p>
       <audio controls aria-describedby="audio-note" src="assets/audio/Soundcafe-Light Rose.mp3">
          Browser Anda tidak mendukung pemutar audio.
       </audio>
    </section>

</body>
</html>
